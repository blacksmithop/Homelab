services:
  torn_faction_app:
    container_name: torn_faction_app
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "8008:8000"
    restart: unless-stopped
    networks:
      - torn_faction
      - services

  postgres:
    image: postgres:16-alpine
    container_name: faction_respect_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    command: >
      postgres
      -c listen_addresses='*'
      -c log_statement=all
    networks:
      - torn_faction

networks:
  torn_faction:
    driver: bridge
    name: torn_faction
    internal: false

  services:
    external: true
    name: services